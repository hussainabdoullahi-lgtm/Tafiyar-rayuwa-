for(var i=0;i<14;i++){trees.push({x:i*260+rnd(0,120),h:rnd(90,170),t:Math.random()<.5})}
for(var i=0;i<12;i++){houses.push({x:i*330+rnd(0,140),w:rnd(90,150),h:rnd(60,110)})}
for(var i=0;i<6;i++){clouds.push({x:rnd(0,W),y:rnd(40,170),w:rnd(120,220)})}
function drawBG(){
 var ph=phase();var g=ctx.createLinearGradient(0,0,0,GY);g.addColorStop(0,rgb(ph.top));g.addColorStop(1,rgb(ph.bot));ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 var night=(ph.p>2.6&&ph.p<3.9)?Math.min(1,(ph.p-2.6)*2,(3.9-ph.p)*3):0;
 if(night>0){ctx.fillStyle='rgba(255,255,255,'+night*.9+')';for(var i=0;i<60;i++){var sx=(i*173)%W,sy=(i*97)%260;ctx.fillRect(sx,sy,2,2)}}
 var sa=ph.p*Math.PI/2.0,sx2=W*.75-(ph.p%4)*0,sy2=150+Math.abs(Math.sin(ph.p*Math.PI/4))*10;
 var sunY=GY-60-Math.sin(((ph.p+0.5)%4)/4*Math.PI)*300;
 var rg=ctx.createRadialGradient(720,sunY,10,720,sunY,200);rg.addColorStop(0,'rgba(255,240,190,.95)');rg.addColorStop(1,'rgba(255,200,120,0)');ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);
 ctx.fillStyle=night>.5?'#e8ecff':'#fff1b8';ctx.beginPath();ctx.arc(720,sunY,night>.5?26:34,0,7);ctx.fill();
 ctx.fillStyle='rgba(255,255,255,'+(.55-night*.4)+')';
 clouds.forEach(function(c){var x=((c.x-dist*.05)%(W+300)+W+300)%(W+300)-150;ctx.beginPath();ctx.ellipse(x,c.y,c.w/2,c.w/7,0,0,7);ctx.ellipse(x+c.w*.2,c.y-10,c.w/3.4,c.w/8,0,0,7);ctx.fill()});
 var tone=1-night*.55;
 function col(r,g_,b,m){return'rgb('+((r*tone*m)|0)+','+((g_*tone*m)|0)+','+((b*tone*m)|0)+')'}
 ctx.fillStyle=col(150,130,140,1);ctx.beginPath();ctx.moveTo(0,GY);for(var x=0;x<=W;x+=20){ctx.lineTo(x,GY-70-Math.sin((x+dist*.08)/130)*28-Math.sin((x+dist*.08)/57)*10)}ctx.lineTo(W,GY);ctx.fill();
 houses.forEach(function(h){var x=((h.x-dist*.25)%(12*330)+12*330)%(12*330)-150;ctx.fillStyle=col(196,140,98,.85);ctx.fillRect(x,GY-h.h-10,h.w,h.h+10);ctx.fillStyle=col(170,116,80,.85);ctx.fillRect(x+h.w*.82,GY-h.h-10,h.w*.18,h.h+10);ctx.fillStyle=col(210,160,116,.9);for(var k=0;k<3;k++){var cx=x+k*h.w/2.2;ctx.beginPath();ctx.moveTo(cx-6,GY-h.h-10);ctx.lineTo(cx,GY-h.h-26);ctx.lineTo(cx+6,GY-h.h-10);ctx.fill()}ctx.fillStyle=col(70,48,34,1);ctx.fillRect(x+h.w*.4,GY-34,h.w*.2,34)});
 trees.forEach(function(tr){var L=14*260,x=((tr.x-dist*.5)%L+L)%L-150;if(tr.t){ctx.fillStyle=col(112,96,82,1);ctx.beginPath();ctx.moveTo(x-14,GY);ctx.quadraticCurveTo(x-18,GY-tr.h*.5,x-8,GY-tr.h*.7);ctx.lineTo(x+8,GY-tr.h*.7);ctx.quadraticCurveTo(x+18,GY-tr.h*.5,x+14,GY);ctx.fill();ctx.fillStyle=col(70,110,60,1);for(var k=-2;k<=2;k++){ctx.beginPath();ctx.ellipse(x+k*18,GY-tr.h*.78-Math.abs(k)*-4,22,14,0,0,7);ctx.fill()}}else{ctx.fillStyle=col(80,62,48,1);ctx.fillRect(x-3,GY-tr.h*.6,6,tr.h*.6);ctx.fillStyle=col(70,106,58,1);ctx.beginPath();ctx.ellipse(x,GY-tr.h*.62,56,16,0,0,7);ctx.fill()}});
 ctx.fillStyle=col(176,150,84,1);ctx.fillRect(0,GY-14,W,40);
 ctx.fillStyle=col(238,214,172,1);ctx.fillRect(0,GY+8,W,H-GY);
 ctx.fillStyle=col(214,188,140,1);for(var i=0;i<30;i++){var x=((i*131-dist)%W+W)%W;ctx.fillRect(x,GY+20+(i*37)%60,24+(i%4)*8,3)}
 ctx.fillStyle=col(150,118,76,1);ctx.fillRect(0,GY+6,W,4);
 var sh=ctx.createLinearGradient(0,0,0,H);sh.addColorStop(0,'rgba(0,0,0,0)');sh.addColorStop(1,'rgba(0,0,0,'+(.25+night*.2)+')');ctx.fillStyle=sh;ctx.fillRect(0,0,W,H);
}
function reset(){dist=0;speed=300;score=0;stars=0;py=0;vy=0;onGround=true;obs=[];pick=[];nextObs=520;hurt=0;t=0}
function jump(){
 if(state==='ready'){reset();state='play';beep(520,.12,'triangle');return}
 if(state==='over'){if(hurt<=0){reset();state='play'}return}
 if(onGround){vy=-780;onGround=false;beep(660,.14,'triangle')}
 held=true}
function release(){held=false}
addEventListener('pointerdown',function(e){e.preventDefault();jump()});addEventListener('pointerup',release);
addEventListener('keydown',function(e){if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){e.preventDefault();if(!e.repeat)jump()}});addEventListener('keyup',function(e){if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW')release()});
function spawn(){
 var r=Math.random(),o;
 if(r<.5)o={t:'stone',x:W+40,w:46,h:34};else if(r<.85)o={t:'thorn',x:W+40,w:56,h:62};else o={t:'double',x:W+40,w:100,h:40};
 obs.push(o);
 var n=3+(Math.random()*3|0),cx=W+40-60;
 for(var i=0;i<n;i++){pick.push({x:cx+i*44+30,y:GY-130-Math.sin(i/(n-1||1)*Math.PI)*70,got:false})}
 nextObs=dist+rnd(420,700)+speed*0.35;
}
function update(dt){
 t+=dt;
 if(state!=='play'){if(hurt>0)hurt-=dt;return}
 speed=Math.min(620,300+dist/18);dist+=speed*dt;score=Math.floor(dist/10);
 var g=held&&vy<0?1500:2600;vy+=g*dt;py+=vy*dt;if(py>=0){py=0;vy=0;onGround=true}
 if(dist>nextObs)spawn();
 obs.forEach(function(o){o.x-=speed*dt});pick.forEach(function(p){p.x-=speed*dt});
 obs=obs.filter(function(o){return o.x>-150});pick=pick.filter(function(p){return p.x>-50&&!p.got});
 var px=150,pw=34,ph=120,top=GY+py-ph;
 pick.forEach(function(p){if(Math.abs(p.x-px)<34&&p.y>top-10&&p.y<GY+py+10){p.got=true;stars++;beep(900+stars*18,.12,'sine',.07)}});
 obs.forEach(function(o){if(px+pw/2>o.x+6&&px-pw/2<o.x+o.w-6&&GY+py>GY-o.h+8){die()}});
}
function die(){state='over';hurt=.8;flash=1;beep(150,.4,'sawtooth',.08);var total=score+stars*20;if(total>best){best=total;try{localStorage.setItem('tr_best',best)}catch(e){}}}
function star(x,y,r,rot){ctx.beginPath();for(var i=0;i<10;i++){var a=rot+i*Math.PI/5-Math.PI/2,rr=i%2?r*.45:r;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}ctx.closePath();ctx.fill()}
function txt(s,x,y,size,col,al,w){ctx.font=(w||700)+' '+size+'px Poppins,system-ui,sans-serif';ctx.textAlign=al||'center';ctx.lineWidth=size/6;ctx.strokeStyle='rgba(30,18,10,.75)';ctx.lineJoin='round';ctx.strokeText(s,x,y);ctx.fillStyle=col;ctx.fillText(s,x,y)}
function draw(){
 drawBG();
 pick.forEach(function(p){ctx.fillStyle='#ffd24a';star(p.x,p.y+Math.sin(t*4+p.x/40)*4,13,t*1.5);ctx.fillStyle='rgba(255,255,255,.7)';star(p.x,p.y+Math.sin(t*4+p.x/40)*4,5,t*1.5)});
 obs.forEach(function(o){
  if(o.t==='stone'||o.t==='double'){var n=o.t==='double'?2:1;for(var k=0;k<n;k++){var x=o.x+k*54;ctx.fillStyle='#7a6a5e';ctx.beginPath();ctx.moveTo(x,GY+6);ctx.quadraticCurveTo(x+2,GY-o.h,x+22,GY-o.h);ctx.quadraticCurveTo(x+46,GY-o.h+4,x+48,GY+6);ctx.fill();ctx.fillStyle='rgba(255,255,255,.18)';ctx.beginPath();ctx.ellipse(x+18,GY-o.h+10,12,5,-.4,0,7);ctx.fill()}}
  else{ctx.strokeStyle='#4a3a22';ctx.lineWidth=4;ctx.fillStyle='#5b7a3a';for(var k=0;k<7;k++){var bx=o.x+6+k*7.5,by=GY+6-o.h*(.55+.45*Math.sin(k*1.7)**2);ctx.beginPath();ctx.moveTo(o.x+28,GY+6);ctx.lineTo(bx,by);ctx.stroke()}ctx.fillStyle='#7aa04a';ctx.beginPath();ctx.ellipse(o.x+28,GY-14,28,22,0,0,7);ctx.fill();ctx.strokeStyle='#e8e0c8';ctx.lineWidth=2;for(var k=0;k<9;k++){var a=k/9*Math.PI+Math.PI;ctx.beginPath();ctx.moveTo(o.x+28+Math.cos(a)*22,GY-14+Math.sin(a)*18);ctx.lineTo(o.x+28+Math.cos(a)*32,GY-14+Math.sin(a)*28);ctx.stroke()}}
 });
 // player
 var fi=onGround&&state==='play'?Math.floor(t*14)%8:(state==='play'?1:(state==='over'?3:Math.floor(t*6)%8));
 var dw=FW*SS,dh=FH*SS,pxx=150-dw/2-4,pyy=GY+8+py-dh+2;
 ctx.save();ctx.fillStyle='rgba(0,0,0,.22)';var sw=44-Math.min(20,-py/6);ctx.beginPath();ctx.ellipse(150,GY+8,sw,7,0,0,7);ctx.fill();
 if(state==='over'&&hurt>0){ctx.globalAlpha=.6+.4*Math.sin(t*60)}
 if(spr.complete)ctx.drawImage(spr,fi*FW,0,FW,FH,pxx,pyy,dw,dh);ctx.restore();
 // HUD
 ctx.fillStyle='rgba(30,18,10,.45)';ctx.fillRect(16,16,214,46);ctx.fillRect(W-250,16,234,46);
 ctx.fillStyle='#ffd24a';star(40,39,13,0);txt(String(stars),62,48,24,'#fff7e6','left');txt('Tazarar tafiya: '+score+' m',W-24,48,18,'#fff7e6','right',500);
 if(state==='ready'){
  ctx.fillStyle='rgba(20,12,30,.45)';ctx.fillRect(0,0,W,H);
  txt('Tafiyar Rayuwa',W/2,190,64,'#ffd24a');
  txt('Ka taka, ka tsallake cikas, ka tara taurari',W/2,244,22,'#fff7e6','center',500);
  var u=1+.05*Math.sin(t*4);ctx.save();ctx.translate(W/2,330);ctx.scale(u,u);ctx.fillStyle='#e3711f';ctx.beginPath();ctx.roundRect?ctx.roundRect(-150,-32,300,64,32):ctx.rect(-150,-32,300,64);ctx.fill();ctx.restore();
  txt('Taɓa don farawa',W/2,340,26,'#fff7e6');
  txt('Taɓa / Space = tsalle (riƙe don tsalle mai tsayi)',W/2,410,17,'#fff7e6','center',500);
  if(best)txt('Mafi girma: '+best,W/2,452,18,'#ffd24a','center',500);
 }
 if(state==='over'){
  ctx.fillStyle='rgba(20,12,30,.55)';ctx.fillRect(0,0,W,H);
  txt('Ka yi tuntuɓe — amma tafiya ba ta ƙare ba',W/2,182,34,'#fff7e6');
  var total=score+stars*20;
  txt('Maki: '+total,W/2,250,52,'#ffd24a');
  txt(score+' m  +  '+stars+' taurari',W/2,290,20,'#fff7e6','center',500);
  txt('Mafi girma: '+best,W/2,326,20,'#fff7e6','center',500);
  if(hurt<=0){ctx.fillStyle='#e3711f';ctx.beginPath();ctx.roundRect?ctx.roundRect(W/2-160,360,320,64,32):ctx.rect(W/2-160,360,320,64);ctx.fill();txt('Sake gwadawa',W/2,402,26,'#fff7e6')}
 }
}
var last=performance.now();
function loop(n){var dt=Math.min(.05,(n-last)/1000);last=n;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
})();
</script>
