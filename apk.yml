name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install and add Android
        run: |
          npm install
          npx cap add android
          npx cap sync android
      - name: Landscape + fullscreen + app icon
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/<activity /<activity android:screenOrientation="sensorLandscape" /' $M
          sed -i 's/android:theme="@style\/AppTheme.NoActionBarLaunch"/android:theme="@style\/AppTheme.NoActionBarLaunch"/' $M
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}
            for f in ic_launcher ic_launcher_round ic_launcher_foreground; do
              convert assets/icon.png -resize ${s}x${s} $R/mipmap-$n/$f.png
            done
          done
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Tafiyar-Rayuwa-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
